apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: myclaude-auth@kubernetescrd
    traefik.ingress.kubernetes.io/router.tls: 'true'
  name: myclaude
  namespace: myclaude
spec:
  ingressClassName: traefik
  rules:
  - host: myclaude.csghome.fun
    http:
      paths:
      - backend:
          service:
            name: myclaude
            port:
              number: 8000
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - myclaude.csghome.fun
    secretName: myclaude-domain-tls
