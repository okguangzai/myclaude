apiVersion: apps/v1
kind: Deployment
metadata:
  name: myclaude
  namespace: myclaude
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: myclaude}
  template:
    metadata:
      labels: {app: myclaude}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets: [{name: harbor-pull}]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: app
          image: IMAGE_PLACEHOLDER
          ports: [{containerPort: 8000}]
          env:
            - {name: MYCLAUDE_ROOT_PATH, value: /myclaude}
            - {name: MYCLAUDE_ALLOWED_HOSTS, value: gitlab.csghome.fun}
            - {name: MYCLAUDE_ALLOWED_ORIGINS, value: 'https://gitlab.csghome.fun'}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '2', memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet:
              path: /api/health
              port: 8000
              httpHeaders: [{name: Host, value: localhost}]
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
              httpHeaders: [{name: Host, value: localhost}]
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
              httpHeaders: [{name: Host, value: localhost}]
            periodSeconds: 30
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: data, mountPath: /workspace, subPath: workspace}
            - {name: config, mountPath: /run/config, readOnly: true}
      initContainers:
        - name: workspace
          image: IMAGE_PLACEHOLDER
          command: [python, -c, 'from pathlib import Path; Path("/data/workspace").mkdir(exist_ok=True)']
          volumeMounts: [{name: data, mountPath: /data}]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: myclaude-data}
        - name: config
          secret: {secretName: myclaude-config, defaultMode: 288}
---
apiVersion: v1
kind: Service
metadata: {name: myclaude, namespace: myclaude}
spec:
  selector: {app: myclaude}
  ports: [{name: http, port: 8000, targetPort: 8000}]
